# Default configuration for the harness.
# Any of these can be overridden with --model / --host / --max-retries CLI flags.

ollama:
  # Ollama runs in a container on this box: 7869 on the host maps to
  # 11434 inside the container, so the reachable address is :7869.
  host: "http://192.168.50.142:7869"
  model: "qwen2.5-coder:7b"
  timeout_seconds: 800

# Extra backends for parallel multi-file generation. When present, the
# multi-file loop runs one worker per endpoint and builds files whose
# dependencies are done concurrently. Omit (or leave empty) to use only
# `ollama.host` above. `model` / `timeout_seconds` default to the values
# under `ollama`. Also settable per run with repeated --endpoint HOST,MODEL[,ROLE].
#
# `role` (optional, default "balanced") tags what an endpoint is for --
# see the README's "Model roles" section:
#   smart    -- preferred for plan / critic / integration-fix (the
#               judgement calls); also builds files like any other
#               endpoint -- not excluded from per-file generation.
#   quick    -- the per-file spec/codegen/fix grind; never used for
#               plan/critic, even as a fallback with no "smart" tagged.
#   balanced -- builds files, and can stand in for "smart" as the
#               plan/critic client if nothing is explicitly tagged
#               "smart". The default; an endpoint with no role (or every
#               endpoint on "balanced") behaves exactly as if roles
#               didn't exist at all.
#   overflow -- the per-file grind only, and only once every non-
#               "overflow" endpoint is already busy building something
#               else -- never used for plan/critic, and never given a
#               file while a preferred endpoint could just take it
#               solo. For a consistently slower/weaker endpoint (e.g. a
#               home-lab box next to a fast local GPU) that should only
#               ever help with genuinely parallel work, not compete for
#               everything.
# endpoints:
#   - host: "http://192.168.50.142:7869"
#     role: "smart"
#   - host: "http://localhost:11434"
#     model: "qwen2.5-coder:7b"
#     role: "quick"

generation:
  # Kept low and stable on purpose: small models drift more at higher temperature,
  # and every step here needs a single predictable output, not creative variety.
  temperature: 0.2
  max_tokens: 2048
  # Ceiling for the adaptive doubling in _generate_and_fix when a response
  # is truncated (Ollama's done_reason == "length") -- gives a fix attempt
  # room to finish a file that ran out of tokens, without letting a single
  # file's budget grow unbounded.
  max_tokens_ceiling: 8192

critic:
  # After a file compiles/lints/imports clean, one more call asks the
  # model to check its own output against the spec it was given -- an
  # opinion, not a deterministic check, so it never hard-fails an
  # otherwise-working file (see FileRunResult.spec_flagged); it just gets
  # bounded fix attempts like any other verify failure, and a persistent
  # disagreement is reported, not fatal. Off saves one LLM call per file.
  enabled: true

super_review:
  # Once every file is built and integration has run, one more pass hands
  # *all* the files to a model and asks it to find whole-project problems
  # (see steps/super_review.py) -- the kind a per-file critic can never
  # see, since it's only ever shown one file. Each finding is checked
  # against a second, independent endpoint before being reported; an
  # unconfirmed finding is still shown, just marked as such. Advisory
  # only, like the per-file critic -- never fails the run. Off by
  # default: heavier than the per-file critic (up to two extra calls per
  # finding), opt in once you've tried it.
  enabled: false

retries:
  # Bounded retries per file's fix loop. Each retry samples a little
  # hotter than the last (see orchestrator._retry_temperature), so these
  # are real extra chances, not identical calls -- a stuck small model
  # gets several shots at breaking a rut before the loop gives up.
  max_fix_attempts: 5
  # Bounded total LLM calls across an entire multi-file run (Phase 2+).
  max_total_iterations: 40
  # Once a file's fix loop reaches this many attempts, an idle endpoint
  # tagged "smart" or "balanced" (never "quick") may start its own
  # independent attempt at the same file in parallel -- whichever finishes
  # first wins, see orchestrator._generate_files. 0 (the default) disables
  # this entirely; only matters with more than one endpoint configured.
  branch_after_fixes: 0

workspace:
  root: "workspace"
