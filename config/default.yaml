# Default configuration for the harness.
# Any of these can be overridden with --model / --host / --max-retries CLI flags.

ollama:
  # Ollama runs in a container on this box: 7869 on the host maps to
  # 11434 inside the container, so the reachable address is :7869.
  host: "http://192.168.50.142:7869"
  model: "qwen2.5-coder:7b"
  timeout_seconds: 800

# Extra backends for parallel multi-file generation. When present, the
# multi-file loop runs one worker per endpoint and builds files whose
# dependencies are done concurrently. Omit (or leave empty) to use only
# `ollama.host` above. `model` / `timeout_seconds` default to the values
# under `ollama`. Also settable per run with repeated --endpoint HOST,MODEL.
# endpoints:
#   - host: "http://192.168.50.142:7869"
#   - host: "http://localhost:11434"
#     model: "qwen2.5-coder:7b"

generation:
  # Kept low and stable on purpose: small models drift more at higher temperature,
  # and every step here needs a single predictable output, not creative variety.
  temperature: 0.2
  max_tokens: 2048
  # Ceiling for the adaptive doubling in _generate_and_fix when a response
  # is truncated (Ollama's done_reason == "length") -- gives a fix attempt
  # room to finish a file that ran out of tokens, without letting a single
  # file's budget grow unbounded.
  max_tokens_ceiling: 8192

critic:
  # After a file compiles/lints/imports clean, one more call asks the
  # model to check its own output against the spec it was given -- an
  # opinion, not a deterministic check, so it never hard-fails an
  # otherwise-working file (see FileRunResult.spec_flagged); it just gets
  # bounded fix attempts like any other verify failure, and a persistent
  # disagreement is reported, not fatal. Off saves one LLM call per file.
  enabled: true

retries:
  # Bounded retries per file's fix loop. Each retry samples a little
  # hotter than the last (see orchestrator._retry_temperature), so these
  # are real extra chances, not identical calls -- a stuck small model
  # gets several shots at breaking a rut before the loop gives up.
  max_fix_attempts: 5
  # Bounded total LLM calls across an entire multi-file run (Phase 2+).
  max_total_iterations: 40

workspace:
  root: "workspace"
